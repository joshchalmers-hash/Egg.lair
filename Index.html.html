<script>
(() => {
'use strict';
// ================= utils =================
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function rng(seed) { let a = seed >>> 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function cumLens(pts) { const c = [0]; for (let i = 1; i < pts.length; i++) c.push(c[i - 1] + dist(pts[i - 1], pts[i])); return c; }
function posAlong(pts, cum, d) {
  const n = pts.length;
  if (d <= 0) { const a = pts[0], b = pts[1]; return { x: a.x, y: a.y, ang: Math.atan2(b.y - a.y, b.x - a.x) }; }
  if (d >= cum[n - 1]) { const a = pts[n - 2], b = pts[n - 1]; return { x: b.x, y: b.y, ang: Math.atan2(b.y - a.y, b.x - a.x) }; }
  let i = 1; while (cum[i] < d) i++;
  const a = pts[i - 1], b = pts[i], t = (d - cum[i - 1]) / (cum[i] - cum[i - 1]);
  return { x: lerp(a.x, b.x, t), y: lerp(a.y, b.y, t), ang: Math.atan2(b.y - a.y, b.x - a.x) };
}
function distToSeg(p, a, b) { const dx = b.x - a.x, dy = b.y - a.y, l2 = dx * dx + dy * dy; let t = l2 ? ((p.x - a.x) * dx + (p.y - a.y) * dy) / l2 : 0; t = clamp(t, 0, 1); return Math.hypot(p.x - (a.x + dx * t), p.y - (a.y + dy * t)); }
function distToPath(p, pts) { let m = 1e9; for (let i = 1; i < pts.length; i++) m = Math.min(m, distToSeg(p, pts[i - 1], pts[i])); return m; }
function angDiff(a, b) { let d = b - a; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU; return d; }
function turnTo(a, b, max) { return a + clamp(angDiff(a, b), -max, max); }

// ================= data =================
const COLS = 12, ROWS = 16, SAVE_KEY = 'egglair.save.v2', LPM = 16;
const AUTO_DELAY = [0, 30, 24, 18]; // seconds before a dropped egg rolls home by itself: a bit less than one wave, so tapping is the real defence
// Auto-return waits a little longer on higher levels: +0.6% per level, capped at 1.3x (level 48 tier 3 = 23s).
const autoDelay = (tier, L) => AUTO_DELAY[tier] * Math.min(1.3, 1 + 0.006 * ((L || 1) - 1));
const EL = { fire: { name: 'Fire', col: '#ff6a2b' }, ice: { name: 'Ice', col: '#7fd0ff' }, poison: { name: 'Poison', col: '#8ef04a' } };
const DCOL = {
  fire:   { body: '#c8341f', belly: '#f5a04a', wing: '#8e1f12', dark: '#5a120a', glow: '#ffb347' },
  ice:    { body: '#3a7fd6', belly: '#bfe6ff', wing: '#245a9c', dark: '#153d6e', glow: '#c8f0ff' },
  poison: { body: '#3f9d3a', belly: '#c9f06a', wing: '#2b6e28', dark: '#174a16', glow: '#b6ff5a' },
};
const STAGE = ['Young', 'Adult', 'Giant'];
const DRAGONS = {
  fire:   { cost: [100, 120, 200], dmg: [18, 34, 62], rate: [1.0, 1.05, 1.1], range: [3.2, 3.4, 3.6], burn: [0, 4, 8], splash: [0, 0, 1.0],
            desc: ['Hot breath, best raw damage.', 'Adult: humans it hits keep burning.', 'Giant: fireballs splash nearby humans.'] },

function itemTier(it) { return it.spell ? spellTier(it.id) : it.id === 'eggs' ? S.save.eggs : it.id === 'auto' ? S.save.auto : (S.save.tiers[it.id] || 0); }
function shopScreen(back) {
  const prev = S.screen; S.screen = 'menu';
  let html = `<h2>Shop <span style="float:right">${S.save.gold} gold</span></h2><p style="margin-top:-6px">Gold comes from finishing levels. Upgrades are permanent.</p><div class="shop">`;
  SHOP.forEach((it, idx) => {
    const tier = itemTier(it), maxed = tier >= it.max, cost = maxed ? 0 : it.cost[tier];
    const locked = it.spell && !maxed && cleared() < SPELL_REQ[tier];
    let desc;
    if (it.spell) { const sp = SPELLS[it.id]; const line = t => `${sp.tdesc(t)} (cooldown ${spellCdFor(it.id, t)}s)`; desc = (tier ? line(tier) + (maxed ? '' : '. Next: ' + line(tier + 1).toLowerCase()) : line(1)) + `. Costs ${sp.meat} meat to cast`; if (locked) desc += `. Tier ${tier + 1} unlocks after ${SPELL_REQ[tier]} levels cleared (${cleared()} so far)`; }
    else desc = it.desc(tier) + (maxed ? '' : '. Next: ' + it.desc(tier + 1).toLowerCase());
    html += `<div class="item"><div><b>${it.name}</b> <span class="tier">${tier + '/' + it.max}</span><small>${desc}</small></div><button data-i="${idx}" ${maxed || locked || S.save.gold < cost ? 'disabled' : ''}>${maxed ? '✓' : locked ? 'locked' : cost + 'g'}</button></div>`;
  });
  html += `</div><div class="btns"><button id="backBtn" class="primary">Done</button></div>`;
  showModal(html);
  document.querySelectorAll('#modal .shop button').forEach(b => { b.onclick = () => { buyItem(SHOP[+b.dataset.i]); shopScreen(back); }; });
  $('backBtn').onclick = () => { S.screen = prev; back(); };
}
function buyItem(it) {
  const tier = itemTier(it); if (tier >= it.max) return; const cost = it.cost[tier]; if (S.save.gold < cost) return; if (it.spell && cleared() < SPELL_REQ[tier]) return;
  S.save.gold -= cost;
  if (it.spell) S.save.spells[it.id] = tier + 1; else if (it.id === 'eggs') S.save.eggs++; else if (it.id === 'auto') S.save.auto++; else S.save.tiers[it.id]++;

}
function showEndScreen(won, stars, gold, first) {
  let html = '';
  if (S.endless) html += `<h2>The raid is over</h2><p>You held the nest through ${Math.max(0, S.wave - 1)} full waves.</p>`;
  else if (won) html += `<h2>Nest defended</h2><div class="bigstars">${'★'.repeat(stars)}<span style="opacity:.25">${'★'.repeat(3 - stars)}</span></div><p class="center">${S.eggsTotal - S.eggsStolen} of ${S.eggsTotal} eggs kept${first ? '. First clear bonus!' : '.'}</p>`;
  else html += `<h2>The nest is empty</h2><p>The humans carried off the last egg on wave ${S.wave}. Kill egg carriers first: dragons already prioritise them, so put your strongest dragons on the way out, and tap dropped eggs to send them home.</p>`;
  html += `<p class="center">Gold earned <b style="color:var(--gold)">+${gold}</b> &nbsp;(you have ${S.save.gold})</p><div class="btns">`;
  const hasNext = !S.endless && won && S.levelIdx < LPM - 1;
  if (hasNext) html += `<button id="nextLvl" class="primary">Next level</button>`;
  html += `<button id="retryBtn" ${hasNext ? '' : 'class="primary"'}>${won ? 'Play again' : 'Try again'}</button><button id="shopBtn2">Shop</button><button id="lvlBtn">Levels</button></div>`;
  showModal(html);
  if (hasNext) $('nextLvl').onclick = () => startLevel(S.mapIdx, S.levelIdx + 1, {});
  $('retryBtn').onclick = () => startLevel(S.mapIdx, S.levelIdx, { endless: S.endless });
  $('shopBtn2').onclick = () => shopScreen(() => showEndScreen(won, stars, gold, first));
  $('lvlBtn').onclick = () => levelScreen(S.mapIdx);
}
function pauseScreen() {
  musicStop();
  if (S.screen !== 'game' || S.over) return; S.paused = true;
  showModal(`<h2>Paused</h2><div class="btns"><button id="resumeBtn" class="primary">Resume</button><button id="restartBtn">Restart level</button><button id="quitBtn">Quit to levels</button><button id="muteBtn">${S.save.muted ? 'Sound on' : 'Sound off'}</button><button id="musicBtn">${S.save.music === false ? 'Music on' : 'Music off'}</button><button id="helpBtn2">How to play</button></div>`);
  $('resumeBtn').onclick = () => { S.paused = false; hideOverlay(); musicStart(); };
  $('musicBtn').onclick = () => { S.save.music = S.save.music === false ? true : false; persist(); if (S.save.music === false) musicStop(); pauseScreen(); };
  $('restartBtn').onclick = () => startLevel(S.mapIdx, S.levelIdx, { endless: S.endless });
  $('quitBtn').onclick = () => { S.over = true; S.paused = false; musicStop(); levelScreen(S.mapIdx); };
  $('muteBtn').onclick = () => { S.save.muted = !S.save.muted; persist(); if (S.save.muted) musicStop(); pauseScreen(); };
  $('helpBtn2').onclick = () => helpScreen(pauseScreen);
}
function helpScreen(back) {
  const sw = c => `<span class="swatch" style="background:${c}"></span>`;
  let html = `<h2>How to play</h2><div class="help">` +
    `<p>Humans walk in through the gate, grab an egg from the nest and walk back out. Every egg that leaves the map is gone. Lose them all and the level is lost.</p>` +
    `<p><b>Dragons</b> are your towers. Tap a stone pad, then a dragon card (or the other way round). Tap a placed dragon to grow it or sell it for 60%. They cost meat, which you get for every human killed and every wave cleared.</p>` +
    `<p>${sw('#ff6a2b')}<b>Fire</b> hits hardest. Adults set humans burning, giants splash. ${sw('#7fd0ff')}<b>Ice</b> slows, adults can freeze, giants pulse a frost nova. ${sw('#8ef04a')}<b>Poison</b> venom keeps hurting and ignores armour; giants poison everything near them.</p>` +
    `<p><b>Eggs</b> dropped by a dead carrier sit on the floor until you tap them home, or until another human picks them up. The auto-return upgrade sends them home for you.</p>` +
    `<p><b>Humans:</b> ` + Object.keys(ENEMIES).map(k => `${sw(ENEMIES[k].col)}${ENEMIES[k].name}: ${ENEMIES[k].tip}`).join(' ') + `</p>` +
    `<p><b>Spells</b> are bought with gold and upgraded to tier 3 as you clear levels. Casting one costs meat and starts a cooldown, so they're a rescue, not a plan: every level can be won with dragons alone. Call the next wave early for bonus meat.</p>` +
    `<p><b>Difficulty</b> can be changed any time from the title or level screen. Easy caps levels at two stars; Hard pays 60% more gold.</p>` +
    `<p><b>Saving</b> is automatic. Inside Claude it goes to your account (the title screen shows "Cloud save on" when that's working); on any other site it stays in the browser. The title screen also has New game to wipe everything and start over.</p>` +
    `<p><b>Progress</b> saves in this browser. Use <b>Save code</b> on the title screen to copy it to another browser or device.</p></div><div class="btns"><button id="backBtn" class="primary">Back</button></div>`;
  showModal(html); $('backBtn').onclick = back;
}

// ================= input =================
function resize() {
  const st = $('stage'), w = st.clientWidth || 360, h = st.clientHeight || 480;
  T = Math.max(8, Math.floor(Math.min(w / COLS, h / ROWS) * 4) / 4);
  CW = Math.floor(T * COLS); CH = Math.floor(T * ROWS);
  DPR = Math.min(2, window.devicePixelRatio || 1);
  canvas.style.width = CW + 'px'; canvas.style.height = CH + 'px'; canvas.style.left = Math.floor((w - CW) / 2) + 'px'; canvas.style.top = Math.floor((h - CH) / 2) + 'px';
  canvas.width = Math.round(CW * DPR); canvas.height = Math.round(CH * DPR);
  if (S.map) buildBackground();
}
function onTap(ux, uy) {
  if (S.screen !== 'game' || S.paused || S.over) return;
  if (S.aiming) { castSpell(S.aiming, { x: ux, y: uy }); return; }
  for (const g of S.dropped) if (!g.dead && !g.returning && Math.hypot(g.x - ux, g.y - uy) < 0.65) { startReturn(g); SFX.tap(); return; }
  for (const dr of S.dragons) if (Math.hypot(dr.x - ux, dr.y - uy) < 0.8) { S.selDragon = (S.selDragon === dr ? null : dr); S.selPad = -1; S.selCard = null; renderPanel(); SFX.tap(); return; }
  for (let i = 0; i < S.map.pads.length; i++) {
    const p = S.map.pads[i]; if (Math.hypot(p.x - ux, p.y - uy) > 0.8 || !padFree(i)) continue;
    if (S.selCard) { if (placeDragon(i, S.selCard)) { S.selCard = null; S.selPad = -1; } else floatText(p.x, p.y - 0.7, 'Need ' + DRAGONS[S.selCard].cost[0] + ' meat', '#ff6a6a'); }
    else S.selPad = (S.selPad === i ? -1 : i);
    S.selDragon = null; renderPanel(); SFX.tap(); return;
  }
  if (S.selPad >= 0 || S.selCard || S.selDragon) { S.selPad = -1; S.selCard = null; S.selDragon = null; renderPanel(); }
}
function bindInput() {
  canvas.addEventListener('pointerdown', ev => { ev.preventDefault(); auInit(); const r = canvas.getBoundingClientRect(); onTap((ev.clientX - r.left) / T, (ev.clientY - r.top) / T); });
  $('nextBtn').addEventListener('click', () => { auInit(); if (S.screen !== 'game' || S.over || S.paused) return; callWave(S.started ? Math.ceil(S.betweenT) : 0); });
  $('speedBtn').addEventListener('click', () => { S.speed = S.speed >= 4 ? 1 : S.speed + 1; updateHud(); });
  $('pauseBtn').addEventListener('click', () => { auInit(); pauseScreen(); });
  document.addEventListener('pointerdown', auInit, { once: true });
  document.addEventListener('visibilitychange', () => { if (document.hidden && S.screen === 'game' && !S.over && !S.paused) pauseScreen(); });
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 200));
}

// ================= loop =================
let last = 0;
function frame(now) {
  if (!last) last = now;
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (S.screen === 'game' && !S.paused && !S.over) { for (let i = 0; i < S.speed; i++) update(dt); updateHud(); }
  else if (S.screen === 'game') { S.time += dt; updateFx(dt); }
  if (S.screen === 'game') draw();
  requestAnimationFrame(frame);
}
function init() {
  S.save = loadSave(); canvas = $('game'); ctx = canvas.getContext('2d');
  resize(); bindInput(); renderPanel(); titleScreen(); requestAnimationFrame(frame); cloudInit();
}
window.EggLair = { S, MAPS, startReturn, DRAGONS, ENEMIES, SHOP, startLevel, placeDragon, upgradeDragon, sellDragon, callWave, update, draw, genWave, distToPath, defaultSave, castSpell, resize, titleScreen };
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
